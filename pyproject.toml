[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flare"
version = "0.1.0"
description = "FLARE: Fuzzy Learned-Antecedent Rule Evidence, a differentiable rule learner"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.1",
]

[project.optional-dependencies]
# The scripts that reproduce the paper (datasets from OpenML, hyperparameter tuning, tables and figures)
experiments = ["openml>=0.14", "optuna>=3.5", "matplotlib>=3.7", "requests", "pyarrow"]
# The compared methods that come from pip (the authors' code of RRL, RL-Net and DR-Net is cloned by
# baselines/fetch_external.py; CLASSY and GRANDE need their own environments, see baselines/README.md)
baselines = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2", "interpret>=0.6", "imodels>=1.4",
             "wittgenstein>=0.3", "torchvision>=0.16", "tqdm"]
# CORELS is only published as a source distribution (it needs a C++ compiler and GMP), so it has an extra of its own
corels = ["corels>=1.1"]
cbm = ["torchvision>=0.16", "pillow", "tqdm"]
graphs = ["h5py>=3.8"]                  # the EMOGI container (the citation graphs need nothing extra)
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["flare*", "baselines*", "experiments*"]

[tool.setuptools.package-data]
"experiments.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
